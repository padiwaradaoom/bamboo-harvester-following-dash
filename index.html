<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard</title>
<style>
:root{--bg:#F4F6FA;--surface:#FFFFFF;--line:#C9D1DD;--ink:#12203A;--ink-2:#3A4760;--blue:#3F6FB5;--err:#A4520D;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 "Anuphan","Kanit",system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:min(360px,100%);background:var(--surface);border-radius:16px;padding:28px 24px;box-shadow:0 0 0 1px #E1E6EE,0 8px 24px rgba(20,33,58,.08);border-top:3px solid var(--blue)}
h1{font-size:19px;font-weight:600;margin:0 0 4px}
p{margin:0 0 18px;color:var(--ink-2);font-size:13.5px}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=password]:focus{outline:2px solid var(--blue);outline-offset:1px}
label.rm{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13px;color:var(--ink-2);cursor:pointer}
button{width:100%;font:inherit;font-weight:600;color:#fff;background:var(--blue);border:0;border-radius:10px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:10px;font-size:13px;color:var(--err)}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Dashboard ติดตามงาน</h1>
  <p>ใส่รหัสผ่านเพื่อเปิดดู</p>
  <input type="password" id="pw" aria-label="รหัสผ่าน" required autofocus>
  <label class="rm"><input type="checkbox" id="rm"> จำรหัสไว้ในเครื่องนี้</label>
  <button id="go">เปิดดู</button>
  <div class="err" id="err" role="alert"></div>
</form>

const KEY="dash-pw";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(P.salt),iterations:P.iter},base,512));
  const iv=b64(P.iv), ct=b64(P.ct), mac=b64(P.mac);
  const mk=await crypto.subtle.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const data=new Uint8Array(iv.length+ct.length); data.set(iv); data.set(ct,iv.length);
  if(!await crypto.subtle.verify("HMAC",mk,mac,data)) return null;
  const ek=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv},ek,ct));
}
function show(html){ document.open(); document.write(html); document.close(); }
const $=id=>document.getElementById(id);
$("f").addEventListener("submit",async e=>{
  e.preventDefault(); $("go").disabled=true; $("err").textContent="กำลังเปิด...";
  try{
    const html=await unlock($("pw").value);
    if(html===null){ $("err").textContent="รหัสผ่านไม่ถูกต้อง"; $("go").disabled=false; return; }
    try{ if($("rm").checked) localStorage.setItem(KEY,$("pw").value); }catch(_){}
    show(html);
  }catch(_){ $("err").textContent="เบราว์เซอร์นี้เปิดไม่ได้ ลองใช้ Chrome, Edge หรือ Safari"; $("go").disabled=false; }
});
(async()=>{ let s=null; try{ s=localStorage.getItem(KEY); }catch(_){}
  if(!s) return; const html=await unlock(s).catch(()=>null);
  if(html!==null) show(html); else { try{ localStorage.removeItem(KEY); }catch(_){} } })();
})();
